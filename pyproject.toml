[project]
name = "comfyui-studio5090-utils"
description = "A film studio pipeline for ComfyUI, designed by a 40-year VFX artist.  Requires the Free STUDIO5090 starter project.  Studio5090 offers to install it on first start.  Cast it, create it, render it.  CASTING builds a character with a voice and an accent and auditions them on camera.  CREATE makes images, character sheets and full multi-angle sets with FLUX.2 and QWEN.  RENDER turns them into finished video with LTX-2.3, first frame to last.  Demos at vimeo.com/showcase/12492601."
version = "1.7.60"
license = { file = "LICENSE" }
dependencies = []

